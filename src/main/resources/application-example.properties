spring.application.name=bus

spring.datasource.url=jdbc:h2:file:./data/bus-alert
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true

app.timezone=Asia/Seoul
app.alert.cooldown-minutes=10

slack.bot-token=${SLACK_BOT_TOKEN:}
slack.signing-secret=${SLACK_SIGNING_SECRET:}

gbis.service-key=${GBIS_SERVICE_KEY:}
gbis.endpoint-url=${GBIS_ENDPOINT_URL:https://apis.data.go.kr/6410000/busarrivalservice/v2}
gbis.station-route-url=${GBIS_STATION_ROUTE_URL:https://apis.data.go.kr/6410000/busstationservice/v2/getBusStationViaRouteListv2}
app.arrival.cache-ttl-seconds=30
