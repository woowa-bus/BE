spring:
  datasource:
    url: jdbc:h2:file:./data/bus-alert
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

app:
  timezone: Asia/Seoul
  alert:
    cooldown-minutes: 10

slack:
  bot-token: ${SLACK_BOT_TOKEN:}
  signing-secret: ${SLACK_SIGNING_SECRET:}

gbis:
  service-key: ${GBIS_SERVICE_KEY:}
  endpoint-url: ${GBIS_ENDPOINT_URL:https://apis.data.go.kr/6410000/busarrivalservice/v2}
  station-route-url: ${GBIS_STATION_ROUTE_URL:https://apis.data.go.kr/6410000/busstationservice/v2/getBusStationViaRouteListv2}
