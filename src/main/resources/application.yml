spring:
  datasource:
    url: jdbc:h2:file:./data/bus-alert
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

app:
  timezone: Asia/Seoul
  alert:
    cooldown-minutes: 10
  bus-routes:
    stations:
      - name: 텔레칩스
        station-id: TODO
        routes:
          - bus-number: "310"
            route-id: TODO
            sta-order: TODO
          - bus-number: "55"
            route-id: TODO
            sta-order: TODO
      - name: 벤처타워(북문)
        station-id: TODO
        routes:
          - bus-number: "310"
            route-id: TODO
            sta-order: TODO

slack:
  bot-token: ${SLACK_BOT_TOKEN:}
  signing-secret: ${SLACK_SIGNING_SECRET:}

gbis:
  service-key: ${GBIS_SERVICE_KEY:}
