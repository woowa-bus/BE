spring:
  datasource:
    url: jdbc:h2:mem:bus-alert-test;MODE=LEGACY;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  timezone: Asia/Seoul
  alert:
    cooldown-minutes: 10
  bus-routes:
    stations:
      - name: 텔레칩스
        station-id: "200000001"
        routes:
          - bus-number: "310"
            route-id: "234000001"
            sta-order: "12"
          - bus-number: "55"
            route-id: "234000002"
            sta-order: "13"
      - name: 벤처타워(북문)
        station-id: "200000002"
        routes:
          - bus-number: "310"
            route-id: "234000003"
            sta-order: "14"
